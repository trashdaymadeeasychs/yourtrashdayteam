[build]
  functions = "netlify/functions"

# Emails the team a digest of unfinished signups (contact step done, card step
# never submitted). Netlify runs scheduled functions on the published deploy only.
[functions."lead-followup"]
  schedule = "*/15 * * * *"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root-level images (logo-nav.jpg, og-social-preview.jpg, favicon) are not under
# /assets and carry unhashed names, so cache them long but keep revalidation.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
